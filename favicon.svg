  <path d="M18 22L32 14L32 34L18 42Z" fill="url(#flowCyan)"/>
  
  <!-- Top Right Prism -->
  <path d="M46 22L32 14L32 34L46 42Z" fill="url(#flowIndigo)"/>
  
  <!-- Bottom Base Prism -->
